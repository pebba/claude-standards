name: ci-flutter
# Reusable PR checks for Flutter repos. Caller: templates/workflows/flutter/ci.yml (required check: "ci / test").

on:
  workflow_call:
    inputs:
      flutter-version:
        description: Exact Flutter version; empty = latest stable
        type: string
        default: ''

permissions:
  contents: read

jobs:
  conventions:
    uses: pebba/claude-standards/.github/workflows/conventions.yml@main

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter-version }}
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test
