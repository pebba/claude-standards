name: publish
description: Commit the bumped files as the repo owner, tag vX.Y.Z, push both atomically and create the GitHub release.
inputs:
  version:
    description: Version from the bump action, X.Y.Z
    required: true
  notes:
    description: Release notes file from the bump action
    required: true
  assets:
    description: Space-separated files or globs to attach (stable names, e.g. dist/app.apk)
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        NOTES: ${{ inputs.notes }}
        ASSETS: ${{ inputs.assets }}
        GH_TOKEN: ${{ github.token }}
        OWNER: ${{ github.repository_owner }}
        OWNER_ID: ${{ github.repository_owner_id }}
      run: |
        # Commits run under the owner's identity, never a bot or Claude.
        git config user.name "$OWNER"
        git config user.email "$OWNER_ID+$OWNER@users.noreply.github.com"
        git add -u
        git add CHANGELOG.md
        git commit -m "chore(release): v$VERSION [skip ci]"
        git tag "v$VERSION"
        # ponytail: a second merge landing mid-release makes this push fail non-fast-forward; rerun the workflow then.
        git push --atomic origin "HEAD:$GITHUB_REF_NAME" "v$VERSION"
        # shellcheck disable=SC2086 # ASSETS is an intentional glob list
        gh release create "v$VERSION" $ASSETS --title "v$VERSION" --notes-file "$NOTES" --verify-tag
